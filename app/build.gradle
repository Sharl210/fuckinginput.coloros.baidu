plugins {
    id 'com.android.application'
}

def recoveredSigningFile = rootProject.file('recovered-signing.jks')
def signingStorePassword = providers.gradleProperty('signingStorePassword').orNull ?: System.getenv('SIGNING_STORE_PASSWORD')
def signingKeyAlias = providers.gradleProperty('signingKeyAlias').orNull ?: System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = providers.gradleProperty('signingKeyPassword').orNull ?: System.getenv('SIGNING_KEY_PASSWORD')
def hasRecoveredSigning = recoveredSigningFile.isFile() &&
    signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'fuckinginput.coloros.baidu'
    compileSdk 37

    defaultConfig {
        applicationId 'fuckinginput.coloros.baidu'
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName '2.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasRecoveredSigning) {
            recovered {
                storeFile recoveredSigningFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            if (hasRecoveredSigning) signingConfig signingConfigs.recovered
        }
        release {
            minifyEnabled true
            shrinkResources false
            if (hasRecoveredSigning) signingConfig signingConfigs.recovered
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'org.luckypray:dexkit:2.2.0'
    compileOnly files('libs/api-82.jar')
}
